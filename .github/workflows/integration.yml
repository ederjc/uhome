name: MQTT integration

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mqtt-integration:
    name: MQTT integration test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOSQUITTO_IMAGE: eclipse-mosquitto:2.1-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # Started as a step instead of a service container so the repo's config can be
      # mounted: without an explicit listener, Mosquitto 2.x only binds to the
      # container's loopback interface and is unreachable from the runner.
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "${GITHUB_WORKSPACE}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            "${MOSQUITTO_IMAGE}"

      - name: Wait for Mosquitto
        run: |
          python - <<'PY'
          import threading
          import time

          import paho.mqtt.client as mqtt

          # A TCP connect alone is not enough: Docker's port proxy accepts connections
          # even when the broker is not listening, so wait for an MQTT CONNACK.
          deadline = time.time() + 30
          last_error = None
          while time.time() < deadline:
              connected = threading.Event()
              client = mqtt.Client(
                  callback_api_version=mqtt.CallbackAPIVersion.VERSION2,
                  client_id="uhome-ci-readiness-probe",
              )
              client.on_connect = lambda c, u, f, rc, p=None: rc == 0 and connected.set()
              try:
                  client.connect("127.0.0.1", 1883, 10)
                  client.loop_start()
                  if connected.wait(2):
                      print("Mosquitto accepted an MQTT connection on 127.0.0.1:1883")
                      client.disconnect()
                      client.loop_stop()
                      raise SystemExit(0)
                  last_error = "no successful CONNACK"
              except OSError as exc:
                  last_error = exc
              client.loop_stop()
              time.sleep(1)
          raise SystemExit(f"Mosquitto did not accept MQTT connections: {last_error}")
          PY

      - name: Run broker-backed integration test
        env:
          UHOME_INTEGRATION_BROKER_HOST: 127.0.0.1
          UHOME_INTEGRATION_BROKER_PORT: "1883"
          UHOME_REQUIRE_REAL_BROKER: "1"
        run: python -m unittest discover -s tests -p test_integration.py -v

      - name: Show Mosquitto logs
        if: always()
        run: docker logs mosquitto || true

      - name: Stop Mosquitto
        if: always()
        run: docker rm -f mosquitto || true
